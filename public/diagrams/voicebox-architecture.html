<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>voicebox — system diagram</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #07090a;
    --panel: rgba(18, 24, 26, 0.72);
    --line: rgba(120, 200, 180, 0.16);
    --ink: #e9f2ec;
    --dim: #8b9a93;
    --ctrl: #8ea2ff;   /* control plane: MCP, CDP, IPC */
    --data: #ffb454;   /* audio data plane: raw PCM     */
    --alt:  #3fe0d0;   /* WebRTC media                  */
    --grid: rgba(255,255,255,0.025);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 34px 24px; background: var(--bg); color: var(--ink);
    font-family: "JetBrains Mono", monospace;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .wrap { max-width: 1240px; margin: 0 auto; }
  h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; letter-spacing: -0.02em; font-size: 26px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 12px; margin: 0 0 18px; }

  .stage-frame { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: #0b0f11; }
  svg.stage { display: block; width: 100%; height: auto; }

  .node {
    width: 100%; height: 100%;
    background: var(--panel); border: 1px solid var(--line); border-radius: 13px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
    opacity: 0; animation: pop 0.55s cubic-bezier(0.2,0.9,0.3,1) forwards;
  }
  .node.ext { border-style: dashed; border-color: rgba(63,224,208,0.35); }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
  .node h3 { font-family: "Bricolage Grotesque"; font-size: 16px; margin: 0; }
  .node .tag { font-size: 8.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .node .port { font-size: 9px; color: var(--alt); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
  .node .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .node .note { font-size: 9.5px; line-height: 1.55; color: var(--dim); }
  .node .inner {
    border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px;
    font-size: 9.5px; line-height: 1.5; color: var(--ink); background: rgba(255,255,255,0.02);
  }
  .node .inner b { color: var(--data); font-weight: 500; }
  .node .pipeline { font-size: 9px; color: var(--alt); line-height: 1.6; }
  .node .tools { display: flex; flex-wrap: wrap; gap: 5px; }
  .node .tools span { font-size: 9px; border: 1px solid rgba(142,162,255,0.4); color: var(--ctrl); border-radius: 5px; padding: 2px 7px; }

  .edge { fill: none; stroke-linecap: round; }
  .draw { stroke-dasharray: var(--len, 600); stroke-dashoffset: var(--len, 600); animation: draw 1.1s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .fade { opacity: 0; animation: fadein 0.9s ease 0.3s forwards; }
  @keyframes fadein { to { opacity: 1; } }

  .lbl { font-family: "JetBrains Mono"; font-size: 10px; fill: var(--dim); }
  .lbl.c { fill: var(--ctrl); }
  .lbl.d { fill: var(--data); }
  .lbl.a { fill: var(--alt); }
  .lbl-bg { fill: #0b0f11; opacity: 0.85; }

  .legend { display: flex; gap: 22px; margin-top: 16px; font-size: 10.5px; color: var(--dim); flex-wrap: wrap; }
  .legend .sw { display: inline-block; width: 22px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 7px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>voicebox</h1>
  <p class="sub">an MCP server that turns a coding agent into a synthetic voice user for browser voice apps</p>

  <div class="stage-frame">
    <!-- Canvas 1240x780. Card coordinates:
         A Claude:        x=40  y=90  w=250 h=190  right edge x=290
         B voicebox:      x=420 y=60  w=300 h=230  left x=420, right x=720, bottom y=290
         C pipecat child: x=420 y=470 w=300 h=250  top y=470, right x=720
         D Chromium:      x=850 y=60  w=350 h=420  left x=850, bottom y=480
         E app backend:   x=850 y=590 w=350 h=130  top y=590 -->
    <svg class="stage" viewBox="0 0 1240 780" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="mCtrl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ea2ff"/></marker>
        <marker id="mData" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffb454"/></marker>
        <marker id="mAlt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fe0d0"/></marker>
      </defs>

      <!-- ===== EDGES ===== -->

      <!-- 1. Claude -> voicebox : MCP (control, dashed, fade) -->
      <path class="edge fade" stroke="var(--ctrl)" stroke-width="2" stroke-dasharray="2 7"
            d="M 290,150 C 340,150 370,150 420,150" marker-end="url(#mCtrl)"/>
      <rect class="lbl-bg" x="288" y="108" width="150" height="16" rx="4"/>
      <text class="lbl c" x="294" y="120">MCP · HTTP :9090</text>

      <!-- 2. Claude -> Chromium : CDP attach, arcs over the top (control, dashed, fade) -->
      <path class="edge fade" stroke="var(--ctrl)" stroke-width="2" stroke-dasharray="2 7"
            d="M 165,90 C 220,15 850,5 1000,60" marker-end="url(#mCtrl)"/>
      <rect class="lbl-bg" x="424" y="14" width="290" height="16" rx="4"/>
      <text class="lbl c" x="430" y="26">drives the UI · @playwright/mcp · CDP :9222</text>

      <!-- 3. voicebox <-> pipecat child : IPC (control, dashed, fade) -->
      <path class="edge fade" stroke="var(--ctrl)" stroke-width="2" stroke-dasharray="2 7"
            d="M 570,290 C 570,360 570,400 570,470" marker-end="url(#mCtrl)" marker-start="url(#mCtrl)"/>
      <rect class="lbl-bg" x="586" y="368" width="230" height="16" rx="4"/>
      <text class="lbl c" x="592" y="380">multiprocessing.Queue · spawn</text>

      <!-- 4. voicebox -> Chromium : launch + inject shim (control, dashed, fade) -->
      <path class="edge fade" stroke="var(--ctrl)" stroke-width="2" stroke-dasharray="2 7"
            d="M 720,120 C 770,120 800,120 850,120" marker-end="url(#mCtrl)"/>
      <rect class="lbl-bg" x="724" y="84" width="122" height="16" rx="4"/>
      <text class="lbl c" x="730" y="96">injects shim.js</text>

      <!-- 5a. pipecat -> shim : Kokoro audio out (data, solid, draw) -->
      <path class="edge draw" style="--len:260" stroke="var(--data)" stroke-width="2.4"
            d="M 720,495 C 765,495 815,420 850,370" marker-end="url(#mData)"/>
      <circle r="3.6" fill="var(--data)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M 720,495 C 765,495 815,420 850,370"/></circle>

      <!-- 5b. shim -> pipecat : WebRTC audio tap in (data, solid, draw) -->
      <path class="edge draw" style="--len:260" stroke="var(--data)" stroke-width="2.4"
            d="M 850,410 C 815,455 765,560 720,560" marker-end="url(#mData)"/>
      <circle r="3.6" fill="var(--data)"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M 850,410 C 815,455 765,560 720,560"/></circle>
      <rect class="lbl-bg" x="722" y="580" width="126" height="46" rx="4"/>
      <text class="lbl d" x="728" y="592">raw 16-bit PCM</text>
      <text class="lbl d" x="728" y="605">WebSocket :9091</text>
      <text class="lbl d" x="728" y="618">▲48 kHz ▼16 kHz</text>

      <!-- 6. page <-> app backend : WebRTC (alt, solid, draw, both directions) -->
      <path class="edge draw" style="--len:180" stroke="var(--alt)" stroke-width="2.4"
            d="M 1025,420 C 1025,480 1025,530 1025,590" marker-end="url(#mAlt)" marker-start="url(#mAlt)"/>
      <rect class="lbl-bg" x="1043" y="492" width="120" height="16" rx="4"/>
      <text class="lbl a" x="1049" y="504">WebRTC · Opus</text>

      <!-- ===== CARDS ===== -->

      <!-- A: Claude -->
      <foreignObject x="40" y="90" width="250" height="190">
        <div xmlns="http://www.w3.org/1999/xhtml" class="node" style="animation-delay:0.05s">
          <div class="top"><h3>Claude</h3><span class="port">MCP client</span></div>
          <div class="tag">your coding agent</div>
          <div class="note">Runs the scenario in plain language: "start the story, interrupt halfway, then ask something off-topic". Orchestrates everything; touches no audio.</div>
        </div>
      </foreignObject>

      <!-- B: voicebox server -->
      <foreignObject x="420" y="60" width="300" height="230">
        <div xmlns="http://www.w3.org/1999/xhtml" class="node" style="animation-delay:0.15s">
          <div class="top"><h3>voicebox</h3><span class="port">FastMCP :9090</span></div>
          <div class="tag">parent process · server.py</div>
          <div class="tools"><span>start_browser_session</span><span>speak</span><span>listen</span><span>stop</span></div>
          <div class="note">Text and control only. No audio code on the MCP request path.</div>
        </div>
      </foreignObject>

      <!-- C: pipecat child -->
      <foreignObject x="420" y="470" width="300" height="215">
        <div xmlns="http://www.w3.org/1999/xhtml" class="node" style="animation-delay:0.25s">
          <div class="top"><h3>Pipecat child</h3><span class="port">WS :9091</span></div>
          <div class="tag">audio pipeline · agent.py / bot.py</div>
          <div class="pipeline">transport.input → Whisper STT → aggregator → Kokoro TTS → transport.output</div>
          <div class="inner">Local models, no API keys. Every session writes <b>events.json</b>, <b>metrics.json</b> and a <b>stereo WAV</b> (tester on one channel, bot on the other).</div>
        </div>
      </foreignObject>

      <!-- D: Chromium -->
      <foreignObject x="850" y="60" width="350" height="360">
        <div xmlns="http://www.w3.org/1999/xhtml" class="node" style="animation-delay:0.35s">
          <div class="top"><h3>Chromium</h3><span class="port">CDP :9222</span></div>
          <div class="tag">Playwright child · --use-fake-ui-for-media-stream</div>
          <div class="inner" style="margin-top:6px">
            <b>your voice app page</b><br/>
            Daily · LiveKit · plain RTCPeerConnection ·<br/>
            anything using getUserMedia + WebRTC.<br/>
            The app is none the wiser.
          </div>
          <div class="inner">
            <b>shim.js</b> (injected before any page code)<br/>
            · overrides getUserMedia → synthetic mic<br/>
            &nbsp;&nbsp;backed by MediaStreamTrackGenerator<br/>
            · wraps RTCPeerConnection → tees every<br/>
            &nbsp;&nbsp;inbound audio track via Web Audio<br/>
            &nbsp;&nbsp;(AudioWorkletNode) back to the server
          </div>
        </div>
      </foreignObject>

      <!-- E: app backend (external) -->
      <foreignObject x="850" y="590" width="350" height="130">
        <div xmlns="http://www.w3.org/1999/xhtml" class="node ext" style="animation-delay:0.45s">
          <div class="top"><h3>Your agent's backend</h3><span class="port">external</span></div>
          <div class="note">The system under test: SFU, voice pipeline, LLM. Sees a normal caller with a normal microphone.</div>
        </div>
      </foreignObject>
    </svg>
  </div>

  <div class="legend">
    <span><span class="sw" style="background:var(--ctrl)"></span>control plane (MCP · CDP · IPC) — text only</span>
    <span><span class="sw" style="background:var(--data)"></span>audio, out-of-band (raw PCM over WebSocket)</span>
    <span><span class="sw" style="background:var(--alt)"></span>WebRTC media (app ↔ its backend)</span>
  </div>
</div>
</body>
</html>
